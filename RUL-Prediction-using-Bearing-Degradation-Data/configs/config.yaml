# Configuration for Bearing RUL Prediction
# KSPHM-KIMM 2025 Data Challenge

# Data configuration
data:
  base_dir: "./data"
  sampling_frequency: 25600  # Hz
  window_seconds: 0.5
  channels:
    - "CH1"
    - "CH2"
    - "CH3"
    - "CH4"
  expected_row_count: 256000

# Preprocessing configuration
preprocessing:
  # Wavelet transform settings
  wavelet:
    function: "db4"
    level: 5
    target_scales:
      - "D4"
      - "D5"

  # Envelope analysis settings
  envelope:
    target_channel: "CH2"
    band_range:
      low: 1000
      high: 5000

  # Normalization parameters (from validation data)
  normalization:
    torque:
      mean: -6.08
      std: 1.68
    temp_front:
      mean: 102.80
      std: 12.30
    temp_rear:
      mean: 115.0
      std: 16.53

# Model configuration
model:
  type: "cnn_lstm"
  input_channels: 15
  cnn:
    out_channels: 64
    kernel_size: 5
  pool:
    kernel_size: 2
  lstm:
    hidden_size: 64
  fc:
    hidden_size: 32
  dropout: 0.0

# Training configuration
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  early_stopping_patience: 10
  validation_split: 0.2
  use_log_transform: true
  device: "auto"  # "auto", "cuda", or "cpu"

# Bearing fault frequencies (Hz)
# Calculated based on bearing geometry and rotation speed
fault_frequencies:
  BPFI: 140.0  # Ball Pass Frequency Inner race
  BPFO: 93.0   # Ball Pass Frequency Outer race
  BSF: 73.0    # Ball Spin Frequency
  FTF: 6.7     # Fundamental Train Frequency

# Frequency analysis bands
analysis_bands:
  - lowcut: 50
    highcut: 500
  - lowcut: 100
    highcut: 800
  - lowcut: 200
    highcut: 1000
  - lowcut: 300
    highcut: 1500

# Dataset paths
datasets:
  train:
    range: [1, 9]  # Train1 to Train8
    path_template: "Train Set/Train{}"
  validation:
    range: [1, 7]  # Validation1 to Validation6
    path_template: "Validation Set/Validation{}"

# Output configuration
output:
  weights_dir: "./weights"
  results_dir: "./results"
  save_preprocessed: true
